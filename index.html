<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items App (Async React & Effects)</title>
  
  <!-- Подключаем React, ReactDOM и Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .grid { display: flex; gap: 20px; margin-top: 20px; }
    .col { flex: 1; border: 1px solid #eaeaea; padding: 15px; border-radius: 8px; background: #fff; }
    form { display: flex; gap: 10px; flex-wrap: wrap; background: #f4f5f7; padding: 15px; border-radius: 8px; }
    input, select, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 120px; }
    textarea { flex: 1 1 100%; height: 60px; }
    button { padding: 8px 12px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-danger { background: #d9381e; }
    button.btn-secondary { background: #666; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    li.selected { background: #e6f7ff; font-weight: bold; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: normal; margin-left: 5px; }
    .badge.available { background: #e6f4ea; color: #137333; }
    .badge.archived { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 1. Fake API ---
    const STORAGE_KEY = 'items_app_data_v2';
    const initialItems = [
      { id: '1', title: 'MacBook Pro 16', description: 'Мощный ноутбук для разработки.', category: 'Электроника', price: 2400, status: 'available', rating: 4.9, createdAt: '2026-01-15' },
      { id: '2', title: 'Механическая клавиатура', description: 'Беспроводная клавиатура с Gateron Yellow.', category: 'Периферия', price: 120, status: 'available', rating: 4.7, createdAt: '2026-02-10' }
    ];

    const getStored = () => JSON.parse(localStorage.getItem(STORAGE_KEY)) || (localStorage.setItem(STORAGE_KEY, JSON.stringify(initialItems)), initialItems);
    const saveStored = (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    const delay = (ms = 600) => new Promise((res) => setTimeout(res, ms));

    const api = {
      getItems: async () => {
        await delay(500);
        return getStored().map(({ id, title, price, status }) => ({ id, title, price, status }));
      },
      getItemById: async (id) => {
        await delay(800);
        const item = getStored().find((i) => i.id === id);
        if (!item) throw new Error('Элемент не найден');
        return item;
      },
      createItem: async (data) => {
        await delay(500);
        const items = getStored();
        const newItem = { ...data, id: Date.now().toString(), createdAt: new Date().toISOString().split('T')[0] };
        items.push(newItem);
        saveStored(items);
        return newItem;
      },
      updateItem: async (id, fields) => {
        await delay(500);
        const items = getStored();
        const idx = items.findIndex((i) => i.id === id);
        if (idx === -1) throw new Error('Не найден');
        items[idx] = { ...items[idx], ...fields };
        saveStored(items);
        return items[idx];
      },
      deleteItem: async (id) => {
        await delay(400);
        saveStored(getStored().filter((i) => i.id !== id));
        return true;
      }
    };

    // --- 2. React Application ---
    function App() {
      const [items, setItems] = useState([]);
      const [listLoading, setListLoading] = useState(false);
      const [listError, setListError] = useState(null);

      const [selectedId, setSelectedId] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [detailsLoading, setDetailsLoading] = useState(false);
      const [detailsError, setDetailsError] = useState(null);

      const [actionPendingId, setActionPendingId] = useState(null);
      const [editingId, setEditingId] = useState(null);

      const [formData, setFormData] = useState({
        title: '', description: '', category: '', price: '', status: 'available', rating: 5
      });

      const loadList = () => {
        setListLoading(true);
        setListError(null);
        api.getItems()
          .then(setItems)
          .catch((err) => setListError(err.message))
          .finally(() => setListLoading(false));
      };

      useEffect(() => {
        loadList();
      }, []);

      // Race Condition protection via cancellation flag
      useEffect(() => {
        if (!selectedId) {
          setSelectedItem(null);
          return;
        }

        let isCancelled = false;
        setDetailsLoading(true);
        setDetailsError(null);

        api.getItemById(selectedId)
          .then((data) => {
            if (!isCancelled) setSelectedItem(data);
          })
          .catch((err) => {
            if (!isCancelled) setDetailsError(err.message);
          })
          .finally(() => {
            if (!isCancelled) setDetailsLoading(false);
          });

        return () => {
          isCancelled = true;
        };
      }, [selectedId]);

      // Stale Closures protection via functional updates
      const handleToggleStatus = (targetId, currentStatus) => {
        setActionPendingId(targetId);
        const newStatus = currentStatus === 'available' ? 'archived' : 'available';

        api.updateItem(targetId, { status: newStatus })
          .then(() => {
            setItems((prev) => prev.map((item) => (item.id === targetId ? { ...item, status: newStatus } : item)));
            setSelectedItem((prev) => (prev && prev.id === targetId ? { ...prev, status: newStatus } : prev));
          })
          .catch((err) => alert(err.message))
          .finally(() => setActionPendingId(null));
      };

      const handleDelete = (targetId) => {
        setActionPendingId(targetId);
        api.deleteItem(targetId)
          .then(() => {
            setItems((prev) => prev.filter((i) => i.id !== targetId));
            if (selectedId === targetId) setSelectedId(null);
          })
          .catch((err) => alert(err.message))
          .finally(() => setActionPendingId(null));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const payload = { ...formData, price: Number(formData.price), rating: Number(formData.rating) };

        if (editingId) {
          api.updateItem(editingId, payload).then((updated) => {
            loadList();
            if (selectedId === editingId) setSelectedItem(updated);
            resetForm();
          });
        } else {
          api.createItem(payload).then(() => {
            loadList();
            resetForm();
          });
        }
      };

      const resetForm = () => {
        setFormData({ title: '', description: '', category: '', price: '', status: 'available', rating: 5 });
        setEditingId(null);
      };

      return (
        <div className="container">
          <h1>Items App (Effects & API)</h1>

          <form onSubmit={handleSubmit}>
            <input placeholder="Название" value={formData.title} onChange={(e) => setFormData({ ...formData, title: e.target.value })} required />
            <input placeholder="Категория" value={formData.category} onChange={(e) => setFormData({ ...formData, category: e.target.value })} required />
            <input type="number" placeholder="Цена" value={formData.price} onChange={(e) => setFormData({ ...formData, price: e.target.value })} required />
            <input type="number" step="0.1" placeholder="Рейтинг (1-5)" value={formData.rating} onChange={(e) => setFormData({ ...formData, rating: e.target.value })} required />
            <select value={formData.status} onChange={(e) => setFormData({ ...formData, status: e.target.value })}>
              <option value="available">available</option>
              <option value="archived">archived</option>
            </select>
            <textarea placeholder="Описание" value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} required />
            <button type="submit">{editingId ? 'Сохранить' : 'Создать'}</button>
            {editingId && <button type="button" className="btn-secondary" onClick={resetForm}>Отмена</button>}
          </form>

          <div className="grid">
            <div className="col">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                <h2>Список элементов</h2>
                <button className="btn-secondary" onClick={loadList} disabled={listLoading}>Reload List 🔄</button>
              </div>

              {listLoading && <p>Загрузка списка...</p>}
              {listError && <p style={{ color: 'red' }}>Ошибка: {listError}</p>}
              {!listLoading && items.length === 0 && <p>Список пуст.</p>}

              <ul>
                {items.map((item) => (
                  <li key={item.id} className={selectedId === item.id ? 'selected' : ''} onClick={() => setSelectedId(item.id)}>
